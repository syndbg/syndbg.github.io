<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Zellij default layout</title><desc id="desc">Illustration of the configured tab bar, radar sidebar, working panes and status bar. Not a live screenshot.</desc><rect width="960" height="520" rx="16" fill="#24273a"/><text x="32" y="44" font-size="17" fill="#b7bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ZELLIJ / CONFIGURATION ILLUSTRATION</text><rect x="24" y="68" width="912" height="44" rx="5" fill="#363a4f"/><text x="42" y="96" font-size="20" fill="#8aadf4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Native tab bar</text><rect x="24" y="124" width="245" height="272" rx="5" fill="#1e2030"/><text x="42" y="164" font-size="24" fill="#c6a0f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">zj-radar</text><text x="42" y="198" font-size="18" fill="#a5adcb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">32 columns</text><text x="42" y="248" font-size="16" fill="#cad3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">density: compact</text><text x="42" y="280" font-size="16" fill="#cad3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">header: false</text><text x="42" y="312" font-size="16" fill="#cad3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">session tree: on</text><rect x="282" y="124" width="654" height="272" rx="5" fill="#1e2030"/><text x="308" y="172" font-size="28" fill="#cad3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Working panes</text><text x="308" y="216" font-size="20" fill="#a6da95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Ctrl-a, /   split right</text><text x="308" y="250" font-size="20" fill="#a6da95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Ctrl-a, -   split below</text><text x="308" y="284" font-size="20" fill="#a6da95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Ctrl-a, r   rename tab</text><text x="308" y="349" font-size="15" fill="#a5adcb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Fullscreen the pane to hide the sidebar.</text><rect x="24" y="410" width="912" height="44" rx="5" fill="#363a4f"/><text x="42" y="439" font-size="20" fill="#f5a97f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">zjstatus   mode + session name</text><text x="32" y="492" font-size="16" fill="#a5adcb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Catppuccin Macchiato · one-line bars · default layout</text></svg>
