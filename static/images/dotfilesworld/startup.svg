<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" role="img" aria-labelledby="title desc"><title id="title">130 ms to 80 ms measured shell startup</title><desc id="desc">Six recorded timings per configuration. The command exits before deferred loading and normal prompt rendering.</desc><rect width="960" height="515" rx="16" fill="#24273a"/><text x="40" y="48" font-size="18" fill="#b7bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SHELL STARTUP / PAIRED RUNS</text><text x="40" y="103" font-size="40" fill="#cad3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">130 ms → 80 ms</text><text x="40" y="140" font-size="18" fill="#a5adcb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Median: −50 ms (−38%) · n = 6 per configuration</text><text x="40" y="197" font-size="20" fill="#cad3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Before</text><rect x="190" y="172" width="520" height="36" rx="4" fill="#f5a97f"/><text x="720" y="197" font-size="20" fill="#f5a97f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">130 ms</text><text x="40" y="287" font-size="20" fill="#cad3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Deferred</text><rect x="190" y="262" width="320" height="36" rx="4" fill="#a6da95"/><text x="520" y="287" font-size="20" fill="#a6da95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">80 ms</text><text x="40" y="360" font-size="20" fill="#f5a97f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Before   130  140  130  130  140  120</text><text x="40" y="392" font-size="20" fill="#a6da95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">After    120  100   80   80   80   80</text><text x="40" y="450" font-size="17" fill="#a5adcb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">zsh -i -c exit · 10 ms timer resolution</text><text x="40" y="480" font-size="16" fill="#a5adcb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Excludes normal prompt rendering and deferred plugin execution.</text></svg>
